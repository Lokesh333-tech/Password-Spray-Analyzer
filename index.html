<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Enterprise authentication log forensics and password-spray attack detection powered by Design and Analysis of Algorithms (DAA)."
    />
    <meta property="og:title" content="Password Spray Analyzer" />
    <meta
      property="og:description"
      content="Intelligent Authentication Threat Detection powered by Merge Sort, Hash Tables, Binary Search, Sliding Window, BFS, and Greedy prioritization."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('psa_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark = saved === 'dark' || ((!saved || saved === 'system') && prefersDark);
          if (useDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#090909';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#FFFFFF';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
